# Builds the APK on every push to master and publishes it as a GitHub Release.
# Generates a temporary release keystore if signing secrets are not configured,
# so the release APK is always signed and installable.
name: Build & Release APK

on:
  push:
    branches: [master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Inject version into build.gradle.kts ──────────────────────────
      # Versioning: the GitHub tag and APK versionName come EXACTLY from
      # versionName in app/build.gradle.kts (e.g. "0.4.2" → tag v0.4.2), so
      # releases and app version always match. versionCode stays tied to
      # run_number because Android requires a monotonically increasing
      # integer for in-place updates.
      - name: Compute version
        id: version
        run: |
          VERSION="$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION" ]; then
            echo "❌ Could not parse a MAJOR.MINOR.PATCH versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          echo "✅ tag=v${VERSION} versionCode=${{ github.run_number }} (run_number)"

      # Rebuilding the same version must not fail on an existing tag/release:
      # delete the previous release and tag so the step below recreates them.
      - name: Clear previous release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          echo "Cleaning release/tag ${TAG} if it exists..."
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || echo "(no previous release)"

      # ── Signing keystore ──────────────────────────────────────────────
      # If SIGNING_KEYSTORE_BASE64 secret is set, decode it into a real keystore.
      # Otherwise, generate a temporary self-signed keystore so the release APK
      # is always signed (installable on devices). The temp keystore is discarded
      # after the workflow run — it should NOT be used for Play Store uploads.
      - name: Set up signing keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "🔓 Using project signing keystore from secrets"
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/romm-sync-release.jks
            cat > keystore.properties <<EOF
          storeFile=/tmp/romm-sync-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          else
            echo "🔐 No signing secrets found — generating temporary keystore"
            keytool -genkeypair \
              -alias romm-sync \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore /tmp/romm-sync-release.jks \
              -storepass rommsync \
              -keypass rommsync \
              -dname "CN=RomM Sync, OU=CI, O=davidrg, L=Madrid, ST=Madrid, C=ES"
            cat > keystore.properties <<EOF
          storeFile=/tmp/romm-sync-release.jks
          storePassword=rommsync
          keyAlias=romm-sync
          keyPassword=rommsync
          EOF
          fi
          echo "✅ keystore.properties created"

      # ── Build both debug and release ──────────────────────────────────
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: romm-sync-release
          path: app/build/outputs/apk/release/app-release.apk

      # ── Create / update a release with the APK ────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **RomM Sync Android** – APK generado automáticamente

            **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            **Build type:** Release (R8 minified + resource shrinking)

            **Para actualizar:** Configuración → Actualizaciones → *Buscar actualizaciones*, o descarga el APK adjunto y ábrelo — se instala encima sin perder datos.
          files: app/build/outputs/apk/release/app-release.apk
